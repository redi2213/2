name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Find Python file
        shell: powershell
        run: |
          $file = Get-ChildItem -Path . -Filter *.py |
                  Where-Object { $_.Name -ne "setup.py" } |
                  Select-Object -First 1

          if (-not $file) {
            Write-Error "No Python file found!"
            exit 1
          }

          echo "PYFILE=$($file.FullName)" >> $env:GITHUB_ENV
          echo "Building: $($file.Name)"

      - name: Build EXE
        run: |
          pyinstaller --onefile --clean "$env:PYFILE"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Windows-EXE
          path: dist/*.exe
